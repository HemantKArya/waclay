[package]
name = "waclay"
description = "Waclay: a runtime-agnostic WebAssembly Component Model runtime with wasmtime, wasmer and wasmi backends."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[dependencies]
waclay-macros = { workspace = true }
wasmparser = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
waclay-macros = { workspace = true }
wasm-encoder = "0.262"
wit-component = { workspace = true }
wit-parser = { workspace = true }
wat = { workspace = true }
waclay-wasmi = { workspace = true }
waclay-wasmtime = { workspace = true }
criterion = { workspace = true }
wasmi = { workspace = true }
wasmtime = { workspace = true, features = ["cranelift", "runtime", "component-model"] }

[target.'cfg(not(windows))'.dev-dependencies]
waclay-wasmer = { workspace = true }

[[bench]]
name = "bench"
harness = false

[features]
default = []
